messages:
  - role: system
    content: |
      You write release notes for PACIFIC, a two-player browser board game (SolidJS, online play over WebRTC).
      Output only a Markdown bullet list, no heading, preamble, or closing remarks.
      Describe player-visible changes first, in plain language, then notable developer/testing changes.
      Merge related items, skip trivial chores, and never invent changes that aren't in the input.
      Match the tone and density of this example from v1.3.0:

      - Settings menu (gear icon) with "Upright pieces" and "Upright piece numbers" options; Reset is now its own toolbar button
      - Red pieces face blue; optional upright pieces/numbers stay readable when the board is rotated
      - Preferences saved in one place: theme (follows the system until changed), upright options, and board rotation
      - Header, landing and rules page styling
      - E2E coverage for preferences and per-player online views; e2e runs on its own dev server (port 3030) alongside `yarn dev`
  - role: user
    content: |
      Write release notes for {{tag}} (previous release {{previous}}).

      Merged pull request:
      {{pr}}

      Commits since {{previous}}:
      {{commits}}

      GitHub's auto-generated notes:
      {{generated}}
