name: PR cleanup

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  remove-preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_PREVIEW_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - uses: ./.github/actions/stack-outputs
      - run: node scripts/preview.mjs remove
        env:
          PR_NUMBER: ${{ github.event.number }}
      - uses: marocchino/sticky-pull-request-comment@v3
        with:
          header: preview
          message: |
            ### Preview removed
            This PR is closed, so its preview has been deleted.
