name: PR title

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

concurrency:
  group: pr-title-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      # The squash-merge commit takes this title, and release.yml derives the semver bump from it.
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: next
        run: node scripts/next-version.mjs
        env:
          TITLE: ${{ github.event.pull_request.title }}
      - uses: marocchino/sticky-pull-request-comment@v3
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        with:
          header: release
          message: |
            Merging this PR releases **${{ steps.next.outputs.tag }}** (current: ${{ steps.next.outputs.previous }}).
